name: Dependency Updates (maven)

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Maven Versions Plugin (use latest releases)
        run: |-
          ./mvnw -B -DgenerateBackupPoms=false versions:use-latest-releases
          ./mvnw -B -DgenerateBackupPoms=false versions:use-latest-versions

      - name: Check for changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "changed=$(git status --porcelain)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changed != ''
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies to latest releases"
          branch: "dep-updates-automatic"
          title: "chore(deps): update dependencies to latest releases"
          body: |
            This automated PR updates direct Maven dependencies to the latest release versions using the Maven Versions Plugin.
            Review and run CI before merging.

